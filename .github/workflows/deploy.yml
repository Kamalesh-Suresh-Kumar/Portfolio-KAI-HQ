name: Deploy Vite to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Top-level workflow permissions restricted to least privilege (read repository contents)
permissions:
  contents: read

# Concurrency isolation strategy:
# - Production pushes to 'main' use a shared group: '${{ github.workflow }}-production'.
#   'cancel-in-progress: false' prevents cancelling an in-progress production deployment,
#   allowing at most one running run and one pending run (latest pending replaces earlier pending).
# - Pull requests use isolated per-PR concurrency groups: '${{ github.workflow }}-pr-${{ github.event.pull_request.number }}'.
#   'cancel-in-progress: true' terminates stale intermediate PR verification runs to conserve resources.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && 'production' || format('pr-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # actions/setup-node@v4.2.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.2.0
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Code style & lint verification gate
        run: npm run lint

      - name: TypeScript type checking gate
        run: npm run typecheck

      - name: Regression & accessibility test suites gate
        run: npm run test:all

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end browser testing gate
        run: npm run test:e2e

      - name: Production application build
        run: npm run build

      - name: Automated bundle budget verification gate
        run: npm run check:bundle

      # actions/upload-pages-artifact@v3.0.1
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Elevated Pages deployment and OIDC token permissions scoped exclusively to deployment job
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # actions/deploy-pages@v4.0.5
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5