name: Deploy Vite to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && 'production' || format('pr-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate production Web3Forms secret
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VITE_WEB3FORMS_ACCESS_KEY: ${{ secrets.VITE_WEB3FORMS_ACCESS_KEY }}
        run: |
          if [ -z "$VITE_WEB3FORMS_ACCESS_KEY" ]; then
            echo "::error::VITE_WEB3FORMS_ACCESS_KEY repository secret is missing."
            exit 1
          fi

      - name: Build Docker CI image
        run: docker build -f Dockerfile.ci -t kai-hq-ci:${{ github.sha }} .

      - name: Run KAI HQ CI pipeline inside Docker
        env:
          VITE_WEB3FORMS_ACCESS_KEY: ${{ github.event_name == 'push' && secrets.VITE_WEB3FORMS_ACCESS_KEY || 'kai-hq-ci-pr-validation-only-00000000' }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"

          docker run --rm \
            -e CI=true \
            -e GITHUB_ACTIONS=true \
            -e VITE_WEB3FORMS_ACCESS_KEY \
            -v "$GITHUB_WORKSPACE/dist:/app/dist" \
            kai-hq-ci:${{ github.sha }} \
            sh -lc "
              npm run lint &&
              npm run typecheck &&
              npm run test:all &&
              npm run generate:fallback -- --production &&
              npx tsc -b &&
              npx vite build &&
              npm run check:bundle &&
              npm run test:e2e
            "

      # actions/upload-pages-artifact@v3.0.1
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # actions/deploy-pages@v4.0.5
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
